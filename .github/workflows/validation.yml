name: 검증 파이프라인 (일봉 수집 · 그림자 장부 · 백테스트)

on:
  schedule:
    - cron: "15 22 * * 1-5"   # 미국 장 마감 후 (한국 07:15) — 일봉 이어 붙이기 + 그림자 장부
    - cron: "0 3 * * 6"       # 토요일 (한국 12:00) — 전체 다시 받기 + 전체 백테스트
  workflow_dispatch:
    inputs:
      mode:
        description: "full = 2010년부터 전체 / update = 최근분만"
        default: "full"
        type: choice
        options: [full, update]
      backtest:
        description: "전체 백테스트도 돌리기"
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: validation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r validation/requirements.txt

      - name: 이전 데이터(data 브랜치) 가져오기
        run: |
          if git ls-remote --exit-code origin data >/dev/null 2>&1; then
            git clone --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" store
            rm -rf store/.git
          else
            mkdir -p store
          fi

      - name: 실행 방식 정하기
        id: cfg
        run: |
          MODE=update; BT=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"; BT="${{ inputs.backtest }}"
          elif [ "${{ github.event.schedule }}" = "0 3 * * 6" ]; then
            MODE=full; BT=true
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"; echo "bt=$BT" >> "$GITHUB_OUTPUT"

      - name: 일봉 받기
        run: python validation/fetch_data.py store/daily --mode ${{ steps.cfg.outputs.mode }}

      - name: v3 신호 일치 확인 (signals.py와 같은지)
        run: |
          python - <<'EOF'
          import glob, sys
          sys.path.insert(0, "validation")
          from v3 import test_equivalence
          fs = sorted(glob.glob("store/daily/*.csv.gz"))
          picks = [f for f in fs if any(t in f for t in ("AAPL", "MSFT", "OMC", "FTNT", "OLLI"))][:5]
          bad = [(f, r) for f in picks for r in [test_equivalence(f)] if not r[0]]
          print("checked", picks, "mismatch", bad)
          sys.exit(1 if bad else 0)
          EOF

      - name: 그림자 장부
        run: python validation/shadow.py store/daily store/shadow

      - name: 전체 백테스트
        if: steps.cfg.outputs.bt == 'true'
        run: python validation/full_bt.py store/daily store/results

      - name: data 브랜치에 저장 (기록 없이 최신본만 유지)
        run: |
          cd store
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u +%F) (${{ steps.cfg.outputs.mode }})"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
